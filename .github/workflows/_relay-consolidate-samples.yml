name: Relay consolidate classifier samples

on:
  push:
    branches:
      - fix/notebook-spec-v1
    paths:
      - .github/workflows/_relay-consolidate-samples.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1
          fetch-depth: 0
      - name: Fetch sample feature branch
        run: git fetch origin feat/add-sample-datasets
      - name: Port sample assets
        run: git checkout origin/feat/add-sample-datasets -- examples/build_sample_datasets.py examples/sample-data/DATASET_CARD.md examples/sample-data/palmer-penguins.zip
      - name: Port sample selector
        run: python scripts/_relay_consolidate_samples.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate consolidated tutorial
        run: |
          pip install -q -r requirements-notebook-ci.txt
          python scripts/validate_colab_tutorial.py
          python scripts/test_colab_csv_headers.py
          python -m compileall -q scripts
      - name: Commit and self-clean
        run: |
          git rm .github/workflows/_relay-consolidate-samples.yml scripts/_relay_consolidate_samples.py
          git config user.name "Kurt Valcorza"
          git config user.email "102845719+kurtvalcorza@users.noreply.github.com"
          git add -A
          git commit -m "feat(tutorials): consolidate classifier sample portfolio [relay-builder]"
          git push origin HEAD:fix/notebook-spec-v1
