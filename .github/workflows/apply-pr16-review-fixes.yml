name: Apply PR16 reviewer fixes

on:
  push:
    branches:
      - fix/notebook-spec-v1
    paths:
      - '.github/workflows/apply-pr16-review-fixes.yml'
      - 'scripts/apply_pr16_reviewer_fixes.py'
      - 'tutorials/requirements-release.in'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lock resolver
        run: python -m pip install 'pip-tools==7.5.2'
      - name: Resolve complete release dependency graph
        run: >-
          pip-compile
          --resolver=backtracking
          --strip-extras
          --no-header
          --no-annotate
          --output-file tutorials/requirements-release.lock
          tutorials/requirements-release.in
      - name: Apply notebook and conformance fixes
        run: python scripts/apply_pr16_reviewer_fixes.py
      - name: Commit reviewer remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(tutorials): address reviewer conformance findings'
          git push origin HEAD:fix/notebook-spec-v1
