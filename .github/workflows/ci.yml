name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tutorial-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The offline suite, the validator and the generator need only the light pins; the package is installed
      # without re-resolving so torch/tabicl and the 110 MB checkpoint are never pulled by the static job.
      - run: pip install numpy==2.5.2 pandas==3.0.5 scikit-learn==1.9.0 pyarrow==25.0.1 'pytest>=8,<9' ruff==0.16.6
      - run: pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests tools
      - name: "Unit tests (offline: snapshot helpers, role helpers, parity)"
        run: pytest -q
      - name: Repository-specific spec 1.1 checks
        run: python scripts/validate_colab_tutorial.py
      - name: Colab CSV header classifications
        run: python scripts/test_colab_csv_headers.py
      - name: Issue 10 tutorial hardening classifications
        run: python scripts/test_issue10_hardening.py
      - name: Validate tutorial and model-card source (NOTEBOOK_SPEC 1.1 standalone carrier)
        run: python tools/validate_release_assets.py
      - name: Standalone notebook parity (NOTEBOOK_SPEC 1.1 PAR3)
        run: |
          python tools/build_notebook.py --check
          python tools/build_notebook.py --check --template tools/notebook_template_artifact_inference.py
      - name: Compile tutorial and public API checks
        run: python -m compileall -q scripts src tools

  release-notebook-execution:
    # The previous kernel-execution job ran the repository-installing pair. The standalone pair needs the executor
    # procedure in docs/release-verification.md (outputs/ workspace, ARTIFACT_ZIP_PATH / NEW_DATA_PATH); until
    # scripts/execute_notebook_release_paths.py is re-pointed at it, this job only states the evidence boundary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain evidence boundary
        run: |
          echo "Static/unit CI is not clean-runtime notebook execution evidence."
          echo "See docs/release-verification.md before promoting the tutorials to release-grade."
